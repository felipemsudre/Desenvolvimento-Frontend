<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gerenciador de Tarefas Acadêmicas</title>
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>

        <section aria-labelledby="busca-filtros">
            <h2 id="busca-filtros">Busca e filtros</h2>

            <form>
                <label for="busca">Buscar tarefa por título:</label>
                <input type="search" id="busca" name="busca">

                <fieldset>
                    <legend>Status</legend>

                    <input type="radio" id="todos-status" name="status" value="todos">
                    <label for="todos-status">Todos</label>

                    <input type="radio" id="a-fazer" name="status" value="a-fazer">
                    <label for="a-fazer">A fazer</label>

                    <input type="radio" id="andamento" name="status" value="andamento">
                    <label for="andamento">Em andamento</label>

                    <input type="radio" id="revisao" name="status" value="revisao">
                    <label for="revisao">Em revisão</label>

                    <input type="radio" id="concluida" name="status" value="concluida">
                    <label for="concluida">Concluída</label>
                </fieldset>

                <fieldset>
                    <legend>Prioridade</legend>

                    <input type="radio" id="todas-prioridades" name="prioridade" value="todas">
                    <label for="todas-prioridades">Todas</label>

                    <input type="radio" id="baixa" name="prioridade" value="baixa">
                    <label for="baixa">Baixa</label>

                    <input type="radio" id="media" name="prioridade" value="media">
                    <label for="media">Média</label>

                    <input type="radio" id="alta" name="prioridade" value="alta">
                    <label for="alta">Alta</label>
                </fieldset>
            </form>
        </section>

        <div id="status" role="status" aria-live="polite"></div>

        <div id="quadro">

            <section aria-labelledby="status-fazer">
                <h2 id="status-fazer">A fazer</h2>
                <ul id="lista-a-fazer"></ul>
            </section>

            <section aria-labelledby="status-andamento">
                <h2 id="status-andamento">Em andamento</h2>
                <ul id="lista-andamento"></ul>
            </section>

            <section aria-labelledby="status-revisao">
                <h2 id="status-revisao">Em revisão</h2>
                <ul id="lista-revisao"></ul>
            </section>

            <section aria-labelledby="status-concluida">
                <h2 id="status-concluida">Concluída</h2>
                <ul id="lista-concluida"></ul>
            </section>

        </div>

    </main>

    <footer>
        <p>Felipe Martins Sudré</p>
        <p>Desenvolvimento Frontend — 2026.2</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
